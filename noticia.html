<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Acelera Trade</title>
  <meta name="description" content="Notícias e conteúdos da Acelera Trade.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="noticias">
  <div id="site-header"></div>

  <main class="col-af">
    <div class="wrap entry">
      <div class="entry-info" id="post"></div>

      <aside class="entry-sidebar">
        <div class="box-newsletter">
          <h4 class="title-common">Assine nossa newsletter</h4>
          <form class="form-af" data-newsletter>
            <input type="text" placeholder="Digite seu nome" required aria-label="Nome">
            <input type="email" placeholder="Digite seu e-mail" required aria-label="E-mail">
            <input type="submit" class="btn" value="Cadastrar-se">
            <small>Ao enviar o formulário, eu declaro que estou de acordo com a <a href="#">Política de Privacidade</a>.</small>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/noticias-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("id");
      const post = NOTICIAS.find(n => n.id === id);
      const el = document.getElementById("post");

      if (!post) {
        el.innerHTML = `<h1 class="title-common">Notícia não encontrada</h1>
          <div class="entry-content"><p>O conteúdo que você procura pode ter sido removido ou o link está incorreto.</p></div>
          <a href="noticias.html" class="btn">Voltar para o blog</a>`;
        return;
      }

      document.title = `${post.titulo} - Acelera Trade`;
      document.querySelector('meta[name="description"]').setAttribute("content", post.resumo);

      // Conteúdo: "## " vira subtítulo, "- " vira item de lista, "> " vira citação.
      let body = "", list = [];
      const flush = () => { if (list.length) { body += `<ul>${list.join("")}</ul>`; list = []; } };
      post.conteudo.forEach(p => {
        if (p.startsWith("- ")) { list.push(`<li>${escapeHtml(p.slice(2))}</li>`); return; }
        flush();
        if (p.startsWith("## ")) body += `<h3>${escapeHtml(p.slice(3))}</h3>`;
        else if (p.startsWith("> ")) body += `<blockquote>${escapeHtml(p.slice(2))}</blockquote>`;
        else body += `<p>${escapeHtml(p)}</p>`;
      });
      flush();

      const url = encodeURIComponent(location.href);
      const text = encodeURIComponent(post.titulo);

      el.innerHTML = `
        <div class="breadcrumb"><a href="index.html">Início</a> / <a href="noticias.html">Blog</a></div>
        <h1 class="title-common">${escapeHtml(post.titulo)}</h1>
        <p class="entry-meta">${formatDate(post.data)} · ${escapeHtml(post.autor)}</p>
        <div class="entry-cover cover">${coverHtml(post)}</div>
        <div class="entry-content">${body}</div>
        <div class="share">
          <a href="https://twitter.com/intent/tweet?text=${text}&url=${url}" target="_blank" rel="noopener">${ICONS.twitter} Twitter</a>
          <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" rel="noopener">${ICONS.facebook} Facebook</a>
          <a href="https://wa.me/?text=${text}%20${url}" target="_blank" rel="noopener">${ICONS.whatsapp} WhatsApp</a>
          <a href="https://www.linkedin.com/sharing/share-offsite/?url=${url}" target="_blank" rel="noopener">${ICONS.linkedin} LinkedIn</a>
        </div>`;
    });
  </script>
</body>
</html>
