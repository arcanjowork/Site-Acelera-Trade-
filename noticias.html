<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Acelera Trade</title>
  <meta name="description" content="Artigos sobre trade marketing, execução no PDV, pessoas, processos e governança, pela Acelera Trade.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="noticias">
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="wrap">
        <div class="breadcrumb"><a href="index.html">Início</a> / Blog</div>
        <span class="eyebrow">Blog Acelera Trade</span>
        <h1 class="title">Conteúdo para quem <em>vive o PDV</em></h1>
        <p class="lead">Execução, pessoas, processos e governança em trade marketing. Do BKO ao PDV.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="noticias-list" id="lista"></div>
        <div class="pages-number" id="paginas"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/noticias-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const POR_PAGINA = 3;
      const todas = sortedNews();
      const total = Math.max(1, Math.ceil(todas.length / POR_PAGINA));
      const pedida = parseInt(new URLSearchParams(location.search).get("pagina"), 10) || 1;
      const pagina = Math.min(Math.max(1, pedida), total);

      document.getElementById("lista").innerHTML =
        noticiasBlockHtml(todas.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA));

      if (total > 1) {
        let html = "";
        for (let p = 1; p <= total; p++) {
          const href = p === 1 ? "noticias.html" : `noticias.html?pagina=${p}`;
          html += `<a class="page-numbers ${p === pagina ? "current" : ""}" href="${href}">${p}</a>`;
        }
        document.getElementById("paginas").innerHTML = html;
      }
    });
  </script>
</body>
</html>
